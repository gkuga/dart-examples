name: jaspr_flutter_example
description: Jaspr site with an embedded Flutter widget.
version: 0.0.1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
     sdk: flutter
  jaspr: ^0.23.4
  jaspr_flutter_embed: ^0.4.11
  jaspr_router: ^0.9.0

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  jaspr_builder: ^0.23.4

jaspr:
  mode: server
  flutter: embedded

flutter:
  uses-material-design: true
