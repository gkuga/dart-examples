name: jaspr_bff_example
description: Jaspr SSR plus a shelf backend — the BFF the SSR sample deliberately has none of.
version: 0.0.1

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.4
  jaspr_router: ^0.9.0
  http: ^1.2.0
  shelf: ^1.4.0
  shelf_router: ^1.1.0

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.0
  jaspr_builder: ^0.23.4
  lints: ^5.0.0

jaspr:
  mode: server
  # --backend shelf: replaces runApp with a shelf Router, which is the only
  # place an API endpoint can live.
